name: Build and push bbb-loadtest

on:
  push:
    tags:
      - 'bbb-loadtest-[0-9]+.[0-9]+.[0-9]+'
jobs:
  pre_build:
    runs-on: ubuntu-latest
    outputs:
      tagName: ${{ steps.tagName.outputs.tag }}
      versionName: ${{ steps.versionName.outputs.tag }}
    steps:
      - name: Filter Tag name
        uses: olegtarasov/get-tag@53af8e1e538a0ffab949cdde3e332d8e58e8630f # v2.1
        id: tagName
        with:
          tagRegex: "(.+?(?=-[0-9]))"
          tagRegexGroup: 1

      - name: Filter Version name
        uses: olegtarasov/get-tag@53af8e1e538a0ffab949cdde3e332d8e58e8630f # v2.1
        id: versionName
        with:
          tagRegex: "${{ steps.tagName.outputs.tag }}-(.*)"
          tagRegexGroup: 1

  build_and_push:
    needs: pre_build
    uses: dbildungsplattform/dbp-github-workflows/.github/workflows/image-publish-trivy.yaml@ac540af7a37263a102c7bc6c8c9447a7b176f027 # 8.6.0
    with:
      container_registry: "ghcr.io"
      image_name: "${{ needs.pre_build.outputs.tagName }}"
      image_tag_generation: "specified,mm_git_tag"
      image_tag: "${{ needs.pre_build.outputs.versionName }}"
      context: ./infrastructure/${{ needs.pre_build.outputs.tagName }}/
  